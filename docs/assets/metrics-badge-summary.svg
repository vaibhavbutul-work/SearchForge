<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMetrics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="180" rx="10" fill="url(#bgMetrics)" stroke="#1F2937" stroke-width="1"/>

  <!-- Metric 1: Automated Tests -->
  <g transform="translate(30, 25)" filter="url(#badgeShadow)">
    <rect width="215" height="130" rx="8" fill="#161F30" stroke="#374151" stroke-width="1"/>
    <circle cx="28" cy="30" r="12" fill="#10B981" fill-opacity="0.2"/>
    <text x="28" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">✓</text>
    <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">TEST SUITE</text>
    <text x="24" y="75" font-family="monospace" font-size="28" font-weight="800" fill="#FFFFFF">273 / 273</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#10B981">100% Hermetic Passing</text>
    <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6B7280">Zero Flake • Fast H2 In-Memory</text>
  </g>

  <!-- Metric 2: Live Crawl & Tokens -->
  <g transform="translate(270, 25)" filter="url(#badgeShadow)">
    <rect width="215" height="130" rx="8" fill="#161F30" stroke="#374151" stroke-width="1"/>
    <circle cx="28" cy="30" r="12" fill="#00E5FF" fill-opacity="0.2"/>
    <text x="28" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">⚡</text>
    <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">LIVE EXPERIMENT</text>
    <text x="24" y="75" font-family="monospace" font-size="28" font-weight="800" fill="#FFFFFF">21,406</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#00E5FF">Tokens Indexed Live</text>
    <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6B7280">16 Web Pages • 3 Public Domains</text>
  </g>

  <!-- Metric 3: Inverted Index Postings -->
  <g transform="translate(510, 25)" filter="url(#badgeShadow)">
    <rect width="215" height="130" rx="8" fill="#161F30" stroke="#374151" stroke-width="1"/>
    <circle cx="28" cy="30" r="12" fill="#818CF8" fill-opacity="0.2"/>
    <text x="28" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#818CF8" text-anchor="middle">☷</text>
    <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">INDEX CAPACITY</text>
    <text x="24" y="75" font-family="monospace" font-size="28" font-weight="800" fill="#FFFFFF">4,526</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#818CF8">Positional Postings</text>
    <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6B7280">1,999 Stemmed Vocabulary Terms</text>
  </g>

  <!-- Metric 4: Retrieval Quality & Speed -->
  <g transform="translate(750, 25)" filter="url(#badgeShadow)">
    <rect width="220" height="130" rx="8" fill="#161F30" stroke="#374151" stroke-width="1"/>
    <circle cx="28" cy="30" r="12" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="28" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">★</text>
    <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">RELEVANCE &amp; SPEED</text>
    <text x="24" y="75" font-family="monospace" font-size="28" font-weight="800" fill="#FFFFFF">1.000 MRR</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#F59E0B">NDCG@5: 0.980 • &lt; 1 ms</text>
    <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6B7280">Perfect Rank #1 on 100% of Queries</text>
  </g>
</svg>
