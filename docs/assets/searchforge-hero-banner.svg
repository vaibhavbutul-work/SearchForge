<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Decorative Network Nodes and Rays -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="3" fill="#00E5FF"/>
    <circle cx="280" cy="40" r="2" fill="#6366F1"/>
    <circle cx="950" cy="90" r="3" fill="#00E5FF"/>
    <circle cx="1080" cy="140" r="2.5" fill="#6366F1"/>
    <circle cx="1020" cy="280" r="3" fill="#10B981"/>
    <line x1="150" y1="80" x2="280" y2="40" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="950" y1="90" x2="1080" y2="140" stroke="#6366F1" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="1080" y1="140" x2="1020" y2="280" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="160" fill="#00E5FF" opacity="0.08" filter="url(#glowFilter)"/>
  <circle cx="1000" cy="200" r="180" fill="#6366F1" opacity="0.10" filter="url(#glowFilter)"/>

  <!-- Top Decorative Pill / Tag -->
  <g transform="translate(60, 42)">
    <rect width="320" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#10B981" filter="url(#glowFilter)"/>
    <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="1">FIRST-PRINCIPLES SEARCH ENGINE</text>
  </g>

  <!-- Main Title: SEARCHFORGE -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    SEARCH<tspan fill="url(#primaryGlow)">FORGE</tspan>
  </text>

  <!-- Subtitle -->
  <text x="60" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    High-Throughput Web Crawler • Positional Inverted Index • Okapi BM25 Ranking Engine
  </text>

  <!-- Architectural Feature Badges -->
  <g transform="translate(60, 210)">
    <!-- Badge 1: Java 21 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#00E5FF">Java 21 LTS</text>
    </g>

    <!-- Badge 2: Spring Boot -->
    <g transform="translate(142, 0)">
      <rect width="150" height="34" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#10B981">Spring Boot</text>
    </g>

    <!-- Badge 3: PostgreSQL -->
    <g transform="translate(304, 0)">
      <rect width="160" height="34" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#60A5FA">PostgreSQL 16</text>
    </g>

    <!-- Badge 4: Virtual Threads -->
    <g transform="translate(476, 0)">
      <rect width="180" height="34" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#F472B6">Virtual Threads</text>
    </g>

    <!-- Badge 5: Okapi BM25 -->
    <g transform="translate(668, 0)">
      <rect width="150" height="34" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#FBBF24">Okapi BM25</text>
    </g>

    <!-- Badge 6: Zero Lucene -->
    <g transform="translate(830, 0)">
      <rect width="160" height="34" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="monospace" font-size="13" font-weight="600" fill="#A78BFA">Zero Lucene/ES</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 275)">
    <rect width="1080" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Metric 1 -->
    <g transform="translate(30, 16)">
      <text x="0" y="14" font-family="monospace" font-size="17" font-weight="700" fill="#10B981">497 / 497</text>
      <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#64748B" letter-spacing="0.5">AUTOMATED TESTS PASSING</text>
    </g>

    <!-- Divider -->
    <line x1="220" y1="12" x2="220" y2="40" stroke="#334155" stroke-width="1"/>

    <!-- Metric 2 -->
    <g transform="translate(250, 16)">
      <text x="0" y="14" font-family="monospace" font-size="17" font-weight="700" fill="#00E5FF">&lt; 1 ms</text>
      <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#64748B" letter-spacing="0.5">AVERAGE QUERY LATENCY</text>
    </g>

    <!-- Divider -->
    <line x1="440" y1="12" x2="440" y2="40" stroke="#334155" stroke-width="1"/>

    <!-- Metric 3 -->
    <g transform="translate(470, 16)">
      <text x="0" y="14" font-family="monospace" font-size="17" font-weight="700" fill="#FBBF24">1.000 MRR</text>
      <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#64748B" letter-spacing="0.5">MEAN RECIPROCAL RANK</text>
    </g>

    <!-- Divider -->
    <line x1="660" y1="12" x2="660" y2="40" stroke="#334155" stroke-width="1"/>

    <!-- Metric 4 -->
    <g transform="translate(690, 16)">
      <text x="0" y="14" font-family="monospace" font-size="17" font-weight="700" fill="#F472B6">1,999 Terms</text>
      <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#64748B" letter-spacing="0.5">VOCABULARY INDEXED</text>
    </g>

    <!-- Divider -->
    <line x1="880" y1="12" x2="880" y2="40" stroke="#334155" stroke-width="1"/>

    <!-- Metric 5 -->
    <g transform="translate(910, 16)">
      <text x="0" y="14" font-family="monospace" font-size="17" font-weight="700" fill="#60A5FA">0 Dependencies</text>
      <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#64748B" letter-spacing="0.5">PURE JAVA FROM SCRATCH</text>
    </g>
  </g>
</svg>
