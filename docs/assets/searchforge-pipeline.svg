<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00E5FF"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="380" rx="12" fill="url(#bgCanvas)" stroke="#1E293B" stroke-width="1"/>

  <!-- Title & Section Header -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">SEARCHFORGE END-TO-END SEARCH PIPELINE</text>
  <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">From raw internet HTML documents to sub-millisecond BM25 ranked query results</text>

  <!-- Connecting Pipeline Pathway -->
  <path d="M 175 160 L 335 160 L 495 160 L 655 160 L 815 160 L 975 160" fill="none" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- STAGE 1: Web Crawler -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="135" height="150" rx="8" fill="url(#cardGrad)" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="24" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle">1</text>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Web Crawler</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94A3B8">• Project Loom</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#94A3B8">• RFC 9309 Robots</text>
    <text x="12" y="86" font-family="monospace" font-size="10" fill="#94A3B8">• Rate Limiting</text>
    <text x="12" y="102" font-family="monospace" font-size="10" fill="#94A3B8">• BFS Frontier</text>
    <rect x="8" y="122" width="119" height="18" rx="4" fill="#00E5FF" fill-opacity="0.1"/>
    <text x="67" y="135" font-family="monospace" font-size="9" fill="#00E5FF" text-anchor="middle" font-weight="600">Jsoup + Loom</text>
  </g>

  <!-- STAGE 2: Content Stripping -->
  <g transform="translate(200, 95)" filter="url(#cardShadow)">
    <rect width="135" height="150" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="24" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">2</text>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">DOM Parser</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94A3B8">• Noise Stripping</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#94A3B8">• Outbound Links</text>
    <text x="12" y="86" font-family="monospace" font-size="10" fill="#94A3B8">• Title Extract</text>
    <text x="12" y="102" font-family="monospace" font-size="10" fill="#94A3B8">• SHA-256 Hash</text>
    <rect x="8" y="122" width="119" height="18" rx="4" fill="#38BDF8" fill-opacity="0.1"/>
    <text x="67" y="135" font-family="monospace" font-size="9" fill="#38BDF8" text-anchor="middle" font-weight="600">Deduplication</text>
  </g>

  <!-- STAGE 3: Linguistic Analysis -->
  <g transform="translate(360, 95)" filter="url(#cardShadow)">
    <rect width="135" height="150" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#818CF8" fill-opacity="0.15"/>
    <text x="24" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">3</text>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Text Analysis</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94A3B8">• Unicode NFD</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#94A3B8">• 130+ Stopwords</text>
    <text x="12" y="86" font-family="monospace" font-size="10" fill="#94A3B8">• Offset Invariant</text>
    <text x="12" y="102" font-family="monospace" font-size="10" fill="#94A3B8">• Porter Stemmer</text>
    <rect x="8" y="122" width="119" height="18" rx="4" fill="#818CF8" fill-opacity="0.1"/>
    <text x="67" y="135" font-family="monospace" font-size="9" fill="#818CF8" text-anchor="middle" font-weight="600">5-Step Cascade</text>
  </g>

  <!-- STAGE 4: Inverted Index -->
  <g transform="translate(520, 95)" filter="url(#cardShadow)">
    <rect width="135" height="150" rx="8" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#6366F1" fill-opacity="0.15"/>
    <text x="24" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#6366F1" text-anchor="middle">4</text>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Inverted Index</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94A3B8">• RAM Dictionary</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#94A3B8">• Positional Array</text>
    <text x="12" y="86" font-family="monospace" font-size="10" fill="#94A3B8">• Postings List</text>
    <text x="12" y="102" font-family="monospace" font-size="10" fill="#94A3B8">• PostgreSQL Tier</text>
    <rect x="8" y="122" width="119" height="18" rx="4" fill="#6366F1" fill-opacity="0.1"/>
    <text x="67" y="135" font-family="monospace" font-size="9" fill="#6366F1" text-anchor="middle" font-weight="600">Dual-Tier RAM/DB</text>
  </g>

  <!-- STAGE 5: Query Parser -->
  <g transform="translate(680, 95)" filter="url(#cardShadow)">
    <rect width="135" height="150" rx="8" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#EC4899" fill-opacity="0.15"/>
    <text x="24" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">5</text>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Query Engine</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94A3B8">• Recursive Parser</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#94A3B8">• Operator AST</text>
    <text x="12" y="86" font-family="monospace" font-size="10" fill="#94A3B8">• Phrase Scanning</text>
    <text x="12" y="102" font-family="monospace" font-size="10" fill="#94A3B8">• TAAT Candidates</text>
    <rect x="8" y="122" width="119" height="18" rx="4" fill="#EC4899" fill-opacity="0.1"/>
    <text x="67" y="135" font-family="monospace" font-size="9" fill="#EC4899" text-anchor="middle" font-weight="600">Linear Merges</text>
  </g>

  <!-- STAGE 6: BM25 Scorer -->
  <g transform="translate(840, 95)" filter="url(#cardShadow)">
    <rect width="135" height="150" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#F59E0B" fill-opacity="0.15"/>
    <text x="24" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">6</text>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">BM25 Ranking</text>
    <text x="12" y="54" font-family="monospace" font-size="10" fill="#94A3B8">• RSJ IDF Math</text>
    <text x="12" y="70" font-family="monospace" font-size="10" fill="#94A3B8">• TF Saturation k1</text>
    <text x="12" y="86" font-family="monospace" font-size="10" fill="#94A3B8">• Length Norm b</text>
    <text x="12" y="102" font-family="monospace" font-size="10" fill="#94A3B8">• Phrase Boost</text>
    <rect x="8" y="122" width="119" height="18" rx="4" fill="#F59E0B" fill-opacity="0.1"/>
    <text x="67" y="135" font-family="monospace" font-size="9" fill="#F59E0B" text-anchor="middle" font-weight="600">k1=1.2, b=0.75</text>
  </g>

  <!-- STAGE 7: Top-K Output -->
  <g transform="translate(1000, 95)" filter="url(#cardShadow)">
    <rect width="70" height="150" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="35" cy="24" r="10" fill="#10B981" fill-opacity="0.15"/>
    <text x="35" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">7</text>
    <text x="35" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">TOP-K</text>
    <text x="35" y="76" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Min-Heap</text>
    <text x="35" y="94" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Priority</text>
    <text x="35" y="112" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Queue</text>
    <text x="35" y="136" font-family="monospace" font-size="10" fill="#10B981" text-anchor="middle" font-weight="700">&lt; 1ms</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 270)">
    <rect width="1030" height="75" rx="8" fill="#0D1322" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#00E5FF">DATA INGESTION &amp; QUERY FLOW INVARIANT:</text>
    <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">
      1. Web Crawler populates PostgreSQL <tspan font-family="monospace" fill="#E2E8F0">crawled_documents</tspan> asynchronously via Virtual Threads.
      2. Indexing Engine tokenizes, stems, and loads positional postings into high-speed RAM structures.
    </text>
    <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">
      3. User search queries execute 100% in memory with zero SQL queries during candidate scoring, returning top-K results in sub-millisecond latencies.
    </text>
  </g>
</svg>
