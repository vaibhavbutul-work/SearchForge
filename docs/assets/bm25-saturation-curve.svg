<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGraph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="bm25CurveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="curveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="10" fill="url(#bgGraph)" stroke="#1E293B" stroke-width="1"/>

  <!-- Title & Formula Header -->
  <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">BM25 TERM FREQUENCY SATURATION vs. LINEAR TF-IDF</text>
  <text x="50" y="68" font-family="monospace" font-size="12" fill="#94A3B8">
    Formula: TF_BM25 = (TF * (k1 + 1)) / (TF + k1 * (1 - b + b * (|d| / L_avg)))  [SearchForge: k1 = 1.2, b = 0.75]
  </text>

  <!-- Graph Grid Area (X: 100 -> 820, Y: 100 -> 340) -->
  <g transform="translate(100, 100)">
    <!-- Grid Lines -->
    <line x1="0" y1="240" x2="720" y2="240" stroke="#334155" stroke-width="1.5"/> <!-- X Axis -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#334155" stroke-width="1.5"/>   <!-- Y Axis -->

    <line x1="0" y1="180" x2="720" y2="180" stroke="#1E293B" stroke-dasharray="4,4"/>
    <line x1="0" y1="120" x2="720" y2="120" stroke="#1E293B" stroke-dasharray="4,4"/>
    <line x1="0" y1="60" x2="720" y2="60" stroke="#1E293B" stroke-dasharray="4,4"/>
    <line x1="0" y1="20" x2="720" y2="20" stroke="#1E293B" stroke-dasharray="4,4"/>

    <!-- Asymptote Line at k1 + 1 = 2.2 (at y = 20) -->
    <line x1="0" y1="20" x2="720" y2="20" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="730" y="24" font-family="monospace" font-size="11" fill="#F59E0B" font-weight="600">Asymptote: k1 + 1 = 2.2</text>

    <!-- X-Axis Labels (Term Frequency TF) -->
    <text x="0" y="260" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">0</text>
    <text x="72" y="260" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">5</text>
    <text x="144" y="260" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">10</text>
    <text x="288" y="260" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">20</text>
    <text x="432" y="260" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">30</text>
    <text x="576" y="260" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">40</text>
    <text x="720" y="260" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">50</text>
    <text x="360" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="600">Term Frequency (TF in Document)</text>

    <!-- Y-Axis Labels (Score Contribution) -->
    <text x="-12" y="244" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">0.0</text>
    <text x="-12" y="184" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">0.6</text>
    <text x="-12" y="124" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">1.2</text>
    <text x="-12" y="64" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">1.8</text>
    <text x="-12" y="24" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">2.2</text>
    <text x="-45" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" transform="rotate(-90, -45, 130)" font-weight="600">Score Multiplier</text>

    <!-- Linear TF Curve (Unbounded Red Line) -->
    <!-- y = 240 - x * (240 / 50) => rises rapidly out of bounds -->
    <path d="M 0 240 L 72 170 L 144 100 L 216 30 L 246 0" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="255" y="15" font-family="monospace" font-size="11" fill="#EF4444" font-weight="600">Linear TF-IDF (Unbounded, Keyword-Stuffing Risk)</text>

    <!-- BM25 Saturation Curve (Cyan-Green Smooth Curve) -->
    <!-- Points calculated for |d| = L_avg: TF=0:y=240, TF=1:1.0, TF=5:1.77, TF=10:1.96, TF=20:2.07, TF=30:2.11, TF=50:2.15 -->
    <path d="M 0 240 
             C 25 130, 50 75, 100 52 
             C 180 32, 350 25, 720 22" 
          fill="none" stroke="url(#bm25CurveGrad)" stroke-width="3.5" filter="url(#curveGlow)"/>

    <!-- Key Milestone Dots on BM25 Curve -->
    <circle cx="15" cy="140" r="4.5" fill="#00E5FF"/>
    <text x="25" y="145" font-family="monospace" font-size="10" fill="#00E5FF">TF=1 (Score: 1.0)</text>

    <circle cx="72" cy="63" r="4.5" fill="#10B981"/>
    <text x="82" y="68" font-family="monospace" font-size="10" fill="#10B981">TF=5 (80% Saturation)</text>

    <circle cx="288" cy="30" r="4.5" fill="#10B981"/>
    <text x="298" y="42" font-family="monospace" font-size="10" fill="#10B981">TF=20 (95% Saturation)</text>

    <!-- Explanatory Callout Box -->
    <g transform="translate(420, 120)">
      <rect width="280" height="90" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00E5FF">Why Okapi BM25 Matters:</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">Repeating a word 50 times in BM25</text>
      <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8">yields only ~22% more score than 5 times.</text>
      <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#10B981" font-weight="600">Guarantees resilience against keyword spam.</text>
    </g>
  </g>
</svg>
