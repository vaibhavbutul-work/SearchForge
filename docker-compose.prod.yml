# ==============================================================================
# SearchForge Production Docker Compose Stack
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: searchforge-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-searchforge_db}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - searchforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d ${DB_NAME:-searchforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: searchforge-backend:latest
    container_name: searchforge-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-searchforge_db}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-15}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-3}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SEARCHFORGE_ADMIN_API_KEY: ${SEARCHFORGE_ADMIN_API_KEY:?SEARCHFORGE_ADMIN_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      SEMANTIC_EMBEDDING_MODEL_TYPE: ${SEMANTIC_EMBEDDING_MODEL_TYPE:-onnx}
      SEARCHFORGE_MODEL_PATH: ${SEARCHFORGE_MODEL_PATH:-/app/models/all-MiniLM-L6-v2.onnx}
      SEMANTIC_EMBEDDING_ALLOW_FALLBACK: ${SEMANTIC_EMBEDDING_ALLOW_FALLBACK:-false}
      RATE_LIMIT_SEARCH_RPM: ${RATE_LIMIT_SEARCH_RPM:-60}
      RATE_LIMIT_SEARCH_BURST: ${RATE_LIMIT_SEARCH_BURST:-20}
      RATE_LIMIT_ADMIN_RPM: ${RATE_LIMIT_ADMIN_RPM:-20}
      RATE_LIMIT_ADMIN_BURST: ${RATE_LIMIT_ADMIN_BURST:-5}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    volumes:
      - searchforge_models:/app/models
    networks:
      - searchforge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2560M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: searchforge-frontend:latest
    container_name: searchforge-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - searchforge-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  searchforge-net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  searchforge_models:
    driver: local
