server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:searchforge_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: SearchForgeDevPool
      initialization-fail-timeout: 0
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

ranking:
  bm25:
    k1: 1.2
    b: 0.75

crawler:
  user-agent: "SearchForgeBot/1.0 (+https://github.com/vaibhavbutul-work/SearchForge)"
  allowed-domains:
    - "www.postgresql.org"
    - "docs.oracle.com"
    - "spring.io"
  max-depth: 1
  max-pages: 15
  crawl-delay-ms: 1000
  concurrency: 2
