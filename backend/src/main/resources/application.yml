server:
  port: 8080

spring:
  application:
    name: searchforge

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:searchforge_db}}
    username: ${DB_USERNAME:searchforge}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SearchForgeHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      initialization-fail-timeout: 0
      connection-timeout: 3000
      validation-timeout: 2000
      leak-detection-threshold: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    env:
      show-values: never
    configprops:
      show-values: never

app:
  name: SearchForge
  version: 1.0.0
  description: Custom Search Engine Built From Scratch

crawler:
  user-agent: "SearchForgeBot/1.0 (+https://github.com/vaibhavbutul-work/SearchForge)"
  seed-urls:
    - "https://example.com"
  allowed-domains:
    - "example.com"
  max-depth: 2
  max-pages: 50
  crawl-delay-ms: 1000
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  concurrency: 4

ranking:
  bm25:
    k1: 1.2
    b: 0.75

searchforge:
  security:
    enabled: true
    admin-api-key: ${SEARCHFORGE_ADMIN_API_KEY:sf-admin-secret-key-prod}
    header-name: "X-API-KEY"
    crawler:
      ssrf-protection-enabled: true
      block-private-ips: true
      max-redirects: 3
    rate-limit:
      enabled: true
      search-requests-per-minute: 60
      search-burst-capacity: 20
      admin-requests-per-minute: 20
      admin-burst-capacity: 5

