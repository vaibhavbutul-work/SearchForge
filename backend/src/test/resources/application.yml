spring:
  application:
    name: searchforge

  datasource:
    url: jdbc:postgresql://localhost:5432/searchforge_db
    username: searchforge
    password: test_dummy_password
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

crawler:
  user-agent: "SearchForgeBot/1.0 (TestEnvironment)"
  seed-urls:
    - "http://localhost:8089/test"
  allowed-domains:
    - "localhost"
  max-depth: 1
  max-pages: 5
  crawl-delay-ms: 10
  connect-timeout-ms: 1000
  read-timeout-ms: 1000
