spring:
  application:
    name: searchforge

  datasource:
    url: jdbc:h2:mem:searchforge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: SearchForgeTestPool
      initialization-fail-timeout: 0

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

crawler:
  user-agent: "SearchForgeBot/1.0 (TestEnvironment)"
  seed-urls:
    - "http://localhost:8089/test"
  allowed-domains:
    - "localhost"
  max-depth: 1
  max-pages: 5
  crawl-delay-ms: 10
  connect-timeout-ms: 1000
  read-timeout-ms: 1000
  concurrency: 2

ranking:
  bm25:
    k1: 1.2
    b: 0.75

