name: SearchForge Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-build-and-test:
    name: Backend Build & Test Suite (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Cache ONNX Embedding Model
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: ~/.cache/searchforge/all-MiniLM-L6-v2.onnx
          key: onnx-model-all-MiniLM-L6-v2-v1

      - name: Download ONNX Embedding Model If Not Cached
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/searchforge
          curl -sSL -o ~/.cache/searchforge/all-MiniLM-L6-v2.onnx https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx || true

      - name: Execute Backend Test Suite
        working-directory: backend
        run: ./mvnw test --batch-mode --no-transfer-progress

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Package Executable JAR
        working-directory: backend
        run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress

  frontend-build-and-test:
    name: Frontend Build & Test Suite (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Execute Frontend Test Suite
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Vite Bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

  security-hygiene:
    name: Secret & Dependency Hygiene Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify No .env Secrets Are Tracked in Git
        run: |
          if git ls-files --error-unmatch .env frontend/.env 2>/dev/null; then
            echo "ERROR: .env file is tracked in Git!"
            exit 1
          fi
          echo "Verified: No .env files are tracked in Git."

      - name: Set up Node.js 20 LTS for Dependency Audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Production Dependency Vulnerability Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  container-validation:
    name: Docker Compose & Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Production Docker Compose Configuration
        run: docker compose -f docker-compose.prod.yml --env-file .env.example config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker buildx build --load -t searchforge-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker buildx build --load -t searchforge-frontend:ci ./frontend
