name: SearchForge Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Hermetic Test Suite (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Execute Full Test Suite (497 Tests)
        working-directory: backend
        run: mvn test --batch-mode --no-transfer-progress || ./mvnw test --batch-mode --no-transfer-progress

      - name: Package Executable JAR
        working-directory: backend
        run: mvn package -DskipTests --batch-mode --no-transfer-progress || ./mvnw package -DskipTests --batch-mode --no-transfer-progress
