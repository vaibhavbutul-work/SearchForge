name: SearchForge Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Hermetic Test Suite (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Cache ONNX Embedding Model
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: ~/.cache/searchforge/all-MiniLM-L6-v2.onnx
          key: onnx-model-all-MiniLM-L6-v2-v1

      - name: Download ONNX Embedding Model If Not Cached
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/searchforge
          curl -sSL -o ~/.cache/searchforge/all-MiniLM-L6-v2.onnx https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx || true

      - name: Execute Full Test Suite (719 Tests)
        working-directory: backend
        run: mvn test --batch-mode --no-transfer-progress || ./mvnw test --batch-mode --no-transfer-progress

      - name: Package Executable JAR
        working-directory: backend
        run: mvn package -DskipTests --batch-mode --no-transfer-progress || ./mvnw package -DskipTests --batch-mode --no-transfer-progress
