name: 🐛 Bug Report
description: Create a report to help us improve SearchForge
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: SearchForge Version & Environment
      description: What JDK and OS are you using?
      placeholder: e.g., Java 21.0.5 LTS, Windows 11 / Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or cURL commands to reproduce the behavior.
      placeholder: |
        1. Start application with '...'
        2. Send GET request to '/api/v1/search?q=...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant terminal or Spring Boot log output.
      render: shell
